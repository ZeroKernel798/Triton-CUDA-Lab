[project]
name = "triton-cuda-lab"
version = "0.1.0"
description = "CUDA and Triton operator lab for GPU kernel experiments."
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib==3.10.9",
    "numpy==2.4.6",
    "nvidia-ml-py>=12.0.0",
    "packaging==26.2",
    "torch==2.6.0",
    "triton==3.2.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

